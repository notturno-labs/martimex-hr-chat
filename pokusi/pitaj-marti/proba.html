    gumba "Dodaj u košaricu" je gumb "Pitaj Marti".

    Chat je isti kao na martimex.hr (isti kod, loader.js i moduli s vrha
    repozitorija), samo je spojen na Voiceflow okruženje "Radim gumb na
    webu" (nacrt), u kojem je napravljen Voiceflow dio za "Pitaj Marti".
    Na martimex.hr se ništa ne mijenja.

      proba.html                          → Versace Dylan Blue (kao na martimex.hr)
      proba.html?artikl=crystal-noir      → parfem na akciji (stara cijena, NC u 30 dana)
      proba.html?artikl=eros-parfum       → artikl bez varijanti
      proba.html?artikl=creamy-delight    → ruž s nijansama
      &izgled=jedan-ekran                 → chat u novom izgledu "Jedan ekran" (zadano: kao na martimex.hr)

      sekcija.querySelectorAll('.product__mobile-images-single[data-gallery-var-id]').forEach(function (s) { s.classList.toggle('hidden', s.getAttribute('data-gallery-var-id') !== id); });
      pomakni(0);
      var puna = gumb.getAttribute('data-var-image-full');
      if (puna && slika) slika.src = puna;
      var boja = sekcija.querySelector('.js-color-name');
      if (boja && gumb.getAttribute('data-var-color')) boja.textContent = gumb.getAttribute('data-var-color');
      var naStanju = v.inStock !== false;
      var obavijest = sekcija.querySelector('.product__variations-no-variation-stock-notice');
      if (obavijest) obavijest.classList.toggle('d-none', naStanju);
      var kolicina = sekcija.querySelector('.product__quantity');
      if (kolicina) kolicina.classList.toggle('d-none', !naStanju);
    }

    sekcija.addEventListener('click', function (e) {
      var g = e.target.closest('.js-var-btn');
      if (g) { izaberi(g); return; }
      if (e.target.closest('.product__featured-image-wrap .js-prev')) { pomakni(-1); return; }
      if (e.target.closest('.product__featured-image-wrap .js-next')) { pomakni(1); return; }
      var t = e.target.closest('.js-small-image');
      if (t && slika) {
        slika.src = t.getAttribute('data-full-src');
        t.parentNode.querySelectorAll('.js-small-image').forEach(function (x) { x.classList.toggle('chosen', x === t); });
        return;
      }
      var q = e.target.closest('.js-qty');
      if (q) {
        var polje = sekcija.querySelector('#productQuantity');
        var n = Math.max(1, (parseInt(polje.value, 10) || 1) + (q.getAttribute('data-value') === '+' ? 1 : -1));
        polje.value = n;
        var manje = sekcija.querySelector('.js-qty[data-value="-"]');
        if (manje) manje.classList.toggle('disabled', n <= 1);
        return;
      }
      if (e.target.closest('.js-add-to-cart')) {
        var obavijest = sekcija.querySelector('.js-cart-notice');
        if (obavijest) { obavijest.classList.add('show'); setTimeout(function () { obavijest.classList.remove('show'); }, 2500); }
      }
    });
  })();
  </script>

  <!-- Marti chat (Martimex) – isti kod kao na martimex.hr, samo: loader.js se
       učitava s vrha ovog repozitorija, a Voiceflow je okruženje "Radim gumb
       na webu" (nacrt) projekta V2 -->
  <script>
  (function () {
    // Zaštita ako je kod slučajno zalijepljen dvaput
    if (window.__martimexChat) return;
    window.__martimexChat = true;

    var GITHUB_LOADER = new URL('../../loader.js', location.href).href;
    var CEKAJ_GITHUB  = 5000;  // ms – nakon toga chat kreće bez dodataka s GitHuba

    // Osnovne Voiceflow postavke – s njima chat radi i kad GitHub ne radi
    var osnovno = {
      verify: { projectID: '6abcf8b2128a6fc786128cca' },
      url: 'https://general-runtime.voiceflow.com',
      voice: { url: 'https://runtime-api.voiceflow.com' },
      environmentID: 'radim-gumb-na-webu',
      versionVariant: 'draft'
    };

    var vfSpreman = false, githubGotov = false, domSpreman = false, pokrenut = false, dodatno = {};

    function ucitajChat(cfg) {
      return Promise.resolve().then(function () { return window.voiceflow.chat.load(cfg); });
    }

    // Chat kreće tek kad su spremni Voiceflow, stranica i GitHub (ili je GitHub otpisan)
    function pokreni() {
      if (pokrenut || !vfSpreman || !githubGotov || !domSpreman) return;
      pokrenut = true;
      ucitajChat(Object.assign({}, osnovno, dodatno))
        .catch(function (e) {
          console.error('[Martimex] Chat se nije pokrenuo s GitHub postavkama – pokrećem osnovni', e);
          return ucitajChat(osnovno);
        })
        .catch(function (e) { console.error('[Martimex] Chat se nije pokrenuo', e); });
    }

    function bezGithuba() {
      if (githubGotov) return;
      console.warn('[Martimex] GitHub nije odgovorio – chat kreće bez dodataka s GitHuba');
      githubGotov = true;
      pokreni();
    }

    // loader.js s GitHuba javlja se ovdje kad je spreman
    window.__martimexGitHub = function (cfg) {
      if (githubGotov) return;  // stiglo prekasno – chat već radi bez toga
      dodatno = cfg || {};
      githubGotov = true;
      pokreni();
    };

    // 1) Stranica
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { domSpreman = true; pokreni(); });
    } else {
      domSpreman = true;
    }

    // 2) Voiceflow widget – uvijek izravno s Voiceflowa
    var vf = document.createElement('script');
    vf.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
    vf.onload = function () { vfSpreman = true; pokreni(); };
    vf.onerror = function () { console.error('[Martimex] Voiceflow widget se nije učitao'); };
    document.head.appendChild(vf);

    // 3) Ekstenzije (i kasnije dizajn) s GitHuba – učitava se istovremeno s Voiceflowom
    var gh = document.createElement('script');
    gh.src = GITHUB_LOADER + '?v=' + Math.floor(Date.now() / 60000);
    gh.onerror = bezGithuba;
    document.head.appendChild(gh);
    setTimeout(bezGithuba, CEKAJ_GITHUB);
  })();
  </script>
</body>
</html>
