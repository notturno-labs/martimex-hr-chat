  <!--
    Proba gumba "Pitaj Marti" (pitaj-marti.js) prije nego išta ide na martimex.hr.

    Sve je u ovoj jednoj datoteci: stranica proizvoda, stranica Kontakt te
    zaglavlje i podnožje webshopa. Stranice su kopije stranica s martimex.hr:
    isti HTML (iste klase, isti x-data podaci, isti gumbi varijanti, isti
    JSON-LD), a stil i slike se učitavaju izravno s martimex.hr. Ispod gumba
    "Dodaj u košaricu" je gumb "Pitaj Marti"; na stranici Kontakt je u okviru
    "Kontakt podaci" redak s gumbom "Pitaj Marti", koji samo otvori chat.
    Između stranica se ide probnom trakom na vrhu ili poveznicom "Kontakt" u
    zaglavlju.

    Chat je isti kao na martimex.hr: isti kod na stranici, a loader.js s
    vrha repozitorija učita iste module (izgled "Jedan ekran" iz
    jedan-ekran.js, gumb chata iz gumb-chata.js, kartica artikla...).
    Jedina razlika: chat je spojen na Voiceflow okruženje "Radim gumb na
    webu" (nacrt), u kojem je napravljen Voiceflow dio za "Pitaj Marti".
    Na martimex.hr se ništa ne mijenja.

      proba.html                          → Versace Dylan Blue (kao na martimex.hr)
      proba.html?artikl=crystal-noir      → parfem na akciji (stara cijena, NC u 30 dana)
      proba.html?artikl=eros-parfum       → artikl bez varijanti
      proba.html?artikl=creamy-delight    → ruž s nijansama
      proba.html?artikl=purple-stain      → nije na stanju ("Obavijesti me"), opis u karticama
      proba.html?stranica=kontakt         → stranica Kontakt (gumb "Pitaj Marti" samo otvori chat)
      &kolacici=ceka                      → kao martimex.hr: chat se učita tek kad se prihvate kolačići (gumb u traci)
      &pitajmarti=debug                   → zapisi modula u konzoli preglednika
      &izgled=dosadasnji                  → dosadašnji početni ekran (pocetna-chata.js), samo za usporedbu
  -->

      var p = document.createElement('div');
      p.className = 'd-flex';
      p.style.position = 'absolute';
      document.body.appendChild(p);
      var ok = getComputedStyle(p).display === 'flex';
      p.remove();
      document.documentElement.classList.toggle('mx-bez-stila', !ok);
    }
    document.addEventListener('DOMContentLoaded', mxpProvjeriStil);
    window.addEventListener('load', mxpProvjeriStil);

  <script>
    // Izgled chata je onaj iz loader.js, kao na martimex.hr ("Jedan ekran").
    // Samo za usporedbu: ?izgled=dosadasnji → dosadašnji početni ekran
    // (pocetna-chata.js), isto kao na testnoj stranici proba.html na vrhu repozitorija
    (function () {
      if (new URLSearchParams(location.search).get('izgled') !== 'dosadasnji') return;
      window.__mxJedanEkran = true;   // jedan-ekran.js (iz loader.js) se ne pokreće
      window.__mxTemaChata = true;    // ni tema-chata.js, ako se uključi u loader.js
      window.MartimexVoiceflow = Object.assign(window.MartimexVoiceflow || {}, { autostart: false, assistant: { persistence: 'sessionStorage' } });
      var s = document.createElement('script');
      s.src = '../../pocetna-chata.js?v=' + Math.floor(Date.now() / 60000);
      document.head.appendChild(s);
    })();
  </script>
  <script>
    // Koja je stranica: ?stranica=kontakt → Kontakt, inače stranica proizvoda.
    // MXP.adresa({ ... }) složi adresu ove stranice s promijenjenim
    // parametrima, a ostali (npr. &pitajmarti=debug) ostaju.
    window.MXP = {
      kontakt: new URLSearchParams(location.search).get('stranica') === 'kontakt',
      adresa: function (promjena) {
        var q = new URLSearchParams(location.search);
        Object.keys(promjena).forEach(function (k) { if (promjena[k]) q.set(k, promjena[k]); else q.delete(k); });
        var s = q.toString();
        return location.pathname + (s ? '?' + s : '');
      }
    };
  </script>
  <script>
    // Zaglavlje i podnožje kao na martimex.hr. HTML je preuzet sa stranice
    // martimex.hr (bez skripti, izbornika koji se otvaraju i prozora za
    // prijavu), a stil dolazi izravno s martimex.hr, pa izgleda isto kao
    // webshop. mxpOkvir('zaglavlje') / mxpOkvir('podnozje') umetne svoj dio
    // točno na mjesto skripte iz koje je pozvan (dok se stranica čita).
    window.mxpOkvir = function (dio) {
      'use strict';
      var skripta = document.currentScript;
      if (!skripta) return;
      function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
      var KONTAKT = esc(MXP.adresa({ stranica: 'kontakt', artikl: '' }));
      var POCETNA = esc(MXP.adresa({ stranica: '', artikl: '' }));

  <!-- Ponašanje stranice kao na martimex.hr (tamo to radi Alpine): odabir
       varijante, sličice galerije, količina, "Dodaj u košaricu" -->
  <script>
  (function () {
    'use strict';
    var sekcija = document.querySelector('section.product');
    if (!sekcija) return;
    var slika = sekcija.querySelector('.js-featured-image');
    var traka = sekcija.querySelector('.swiper-product-featured .swiper-wrapper');
    var slajd = 0;

    // klizač slika (mobitel): pomak za cijelu širinu, samo kroz slike odabrane varijante
    function pomakni(smjer) {
      if (!traka) return;
      var vidljivi = traka.querySelectorAll('.product__mobile-images-single:not(.hidden)').length;
      slajd = smjer === 0 ? 0 : Math.max(0, Math.min(vidljivi - 1, slajd + smjer));
      traka.style.transitionDuration = smjer === 0 ? '0ms' : '300ms';
      traka.style.transform = 'translate3d(' + (-100 * slajd) + '%, 0, 0)';
    }

    function prikazi(sel, atr, id) {
      sekcija.querySelectorAll(sel).forEach(function (el) { el.classList.toggle('d-none', el.getAttribute(atr) !== String(id)); });
    }
    function izaberi(gumb) {
      var id = gumb.getAttribute('data-variation-id');
      var v = (window.__mxpVarijante || {})[id] || {};
      sekcija.querySelectorAll('.js-var-btn').forEach(function (b) { b.classList.toggle('active', b === gumb); });
      prikazi('.js-var-price', 'data-price-var-id', id);
      prikazi('.js-var-sku', 'data-sku-var-id', id);
      prikazi('.js-lowest-price', 'data-lowest-price-var-id', id);
      sekcija.querySelectorAll('.js-var-gallery[data-gallery-var-id]').forEach(function (g) { g.classList.toggle('active', g.getAttribute('data-gallery-var-id') === id); });
      sekcija.querySelectorAll('.product__mobile-images-single[data-gallery-var-id]').forEach(function (s) { s.classList.toggle('hidden', s.getAttribute('data-gallery-var-id') !== id); });
      pomakni(0);
      var puna = gumb.getAttribute('data-var-image-full');
      if (puna && slika) slika.src = puna;
      var boja = sekcija.querySelector('.js-color-name');
      if (boja && gumb.getAttribute('data-var-color')) boja.textContent = gumb.getAttribute('data-var-color');
      var naStanju = v.inStock !== false;
      var obavijest = sekcija.querySelector('.product__variations-no-variation-stock-notice');
      if (obavijest) obavijest.classList.toggle('d-none', naStanju);
      var kolicina = sekcija.querySelector('.product__quantity');
      if (kolicina) kolicina.classList.toggle('d-none', !naStanju);
    }

    sekcija.addEventListener('click', function (e) {
      var g = e.target.closest('.js-var-btn');
      if (g) { izaberi(g); return; }
      if (e.target.closest('.product__featured-image-wrap .js-prev')) { pomakni(-1); return; }
      if (e.target.closest('.product__featured-image-wrap .js-next')) { pomakni(1); return; }
      var t = e.target.closest('.js-small-image');
      if (t && slika) {
        slika.src = t.getAttribute('data-full-src');
        t.parentNode.querySelectorAll('.js-small-image').forEach(function (x) { x.classList.toggle('chosen', x === t); });
        return;
      }
      var q = e.target.closest('.js-qty');
      if (q) {
        var polje = sekcija.querySelector('#productQuantity');
        var n = Math.max(1, (parseInt(polje.value, 10) || 1) + (q.getAttribute('data-value') === '+' ? 1 : -1));
        polje.value = n;
        var manje = sekcija.querySelector('.js-qty[data-value="-"]');
        if (manje) manje.classList.toggle('disabled', n <= 1);
        return;
      }
      // kartice opisa (na računalu) i harmonika (na mobitelu), kao productTabs na martimex.hr
      var kartica = e.target.closest('.product__description-tabs-nav-btn');
      if (kartica) {
        var id = kartica.getAttribute('data-tab-id');
        sekcija.querySelectorAll('.product__description-tabs-nav-btn').forEach(function (b) { b.classList.toggle('active', b === kartica); });
        sekcija.querySelectorAll('.product__description-tabs-content-item').forEach(function (c) { c.classList.toggle('active', c.id === id); });
        return;
      }
      var harmonika = e.target.closest('.product__description-tabs-faq-header');
      if (harmonika) {
        var otvorena = !harmonika.classList.contains('active');
        harmonika.classList.toggle('active', otvorena);
        var sadrzaj = harmonika.nextElementSibling;
        if (sadrzaj) sadrzaj.classList.toggle('active', otvorena);
        var strelica = harmonika.querySelector('.arrow');
        if (strelica) strelica.classList.toggle('active', otvorena);
        return;
      }
      if (e.target.closest('.js-add-to-cart')) {
        var obavijest = sekcija.querySelector('.js-cart-notice');
        if (obavijest) { obavijest.classList.add('show'); setTimeout(function () { obavijest.classList.remove('show'); }, 2500); }
      }
    });
  })();
  </script>

  <!-- Marti chat (Martimex) – isti kod kao na martimex.hr, samo: loader.js se
       učitava s vrha ovog repozitorija, a Voiceflow je okruženje "Radim gumb
       na webu" (nacrt) projekta V2 -->
  <script>
  (function () {
    // Zaštita ako je kod slučajno zalijepljen dvaput
    if (window.__martimexChat) return;
    window.__martimexChat = true;

    var GITHUB_LOADER = new URL('../../loader.js', location.href).href;
    var CEKAJ_GITHUB  = 5000;  // ms – nakon toga chat kreće bez dodataka s GitHuba

    // Osnovne Voiceflow postavke – s njima chat radi i kad GitHub ne radi
    var osnovno = {
      verify: { projectID: '6abcf8b2128a6fc786128cca' },
      url: 'https://general-runtime.voiceflow.com',
      voice: { url: 'https://runtime-api.voiceflow.com' },
      environmentID: 'radim-gumb-na-webu',
      versionVariant: 'draft'
    };

    var vfSpreman = false, githubGotov = false, domSpreman = false, pokrenut = false, dodatno = {};

    function ucitajChat(cfg) {
      return Promise.resolve().then(function () { return window.voiceflow.chat.load(cfg); });
    }

    // Chat kreće tek kad su spremni Voiceflow, stranica i GitHub (ili je GitHub otpisan)
    function pokreni() {
      if (pokrenut || !vfSpreman || !githubGotov || !domSpreman) return;
      pokrenut = true;
      ucitajChat(Object.assign({}, osnovno, dodatno))
        .catch(function (e) {
          console.error('[Martimex] Chat se nije pokrenuo s GitHub postavkama – pokrećem osnovni', e);
          return ucitajChat(osnovno);
        })
        .catch(function (e) { console.error('[Martimex] Chat se nije pokrenuo', e); });
    }

    function bezGithuba() {
      if (githubGotov) return;
      console.warn('[Martimex] GitHub nije odgovorio – chat kreće bez dodataka s GitHuba');
      githubGotov = true;
      pokreni();
    }

    // loader.js s GitHuba javlja se ovdje kad je spreman
    window.__martimexGitHub = function (cfg) {
      if (githubGotov) return;  // stiglo prekasno – chat već radi bez toga
      dodatno = cfg || {};
      githubGotov = true;
      pokreni();
    };

    // 1) Stranica
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { domSpreman = true; pokreni(); });
    } else {
      domSpreman = true;
    }

    function ucitajSve() {
      // 2) Voiceflow widget – uvijek izravno s Voiceflowa
      var vf = document.createElement('script');
      vf.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
      vf.onload = function () { vfSpreman = true; pokreni(); };
      vf.onerror = function () { console.error('[Martimex] Voiceflow widget se nije učitao'); };
      document.head.appendChild(vf);

      // 3) Ekstenzije (i kasnije dizajn) s GitHuba – učitava se istovremeno s Voiceflowom
      var gh = document.createElement('script');
      gh.src = GITHUB_LOADER + '?v=' + Math.floor(Date.now() / 60000);
      gh.onerror = bezGithuba;
      document.head.appendChild(gh);
      setTimeout(bezGithuba, CEKAJ_GITHUB);
    }

    // Samo na probi: ?kolacici=ceka oponaša martimex.hr, gdje se chat učita
    // tek kad kupac na traci s kolačićima prihvati sve (događaj
    // "martimex:cookies-accepted" s detail "allCookies")
    var kolacici = new URLSearchParams(location.search).get('kolacici') === 'ceka';
    var prihvaceno = false;
    try { prihvaceno = sessionStorage.getItem('mxp-kolacici') === 'allCookies'; } catch (e) { /* nije bitno */ }
    if (!kolacici || prihvaceno) { ucitajSve(); return; }
    var ucitano = false;
    document.addEventListener('martimex:cookies-accepted', function (e) {
      if (e.detail !== 'allCookies' || ucitano) return;
      ucitano = true;
      try { sessionStorage.setItem('mxp-kolacici', 'allCookies'); } catch (x) { /* nije bitno */ }
      ucitajSve();
    });
    var gumbKolacici = document.getElementById('mxp-kolacici');
    if (gumbKolacici) {
      gumbKolacici.hidden = false;
      gumbKolacici.addEventListener('click', function () {
        gumbKolacici.hidden = true;
        document.dispatchEvent(new CustomEvent('martimex:cookies-accepted', { detail: 'allCookies' }));
      });
    }
  })();
  </script>
