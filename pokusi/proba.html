<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marti – pokusne animacije</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1b1d; }
  </style>
</head>
<body>
  <!--
    Pokusna stranica: glumi Voiceflowov prozor chata (element #voiceflow-chat
    sa shadow rootom, prozor .vfrc-chat i gumb #vfrc-start-chat), pa se početni
    ekran vidi kao u pravom chatu, bez Voiceflowa i bez martimex.hr.
    Koja se skripta učita, zadaje se u adresi:
      proba.html?skripta=saturn/pocetna-chata-saturn.js   (Saturn: prsten bočica oko flakona)
      proba.html?skripta=kap/pocetna-chata-kap.js         (Kap esencije)
      proba.html?skripta=../pocetna-chata.js              (sadašnja animacija, za usporedbu)
    Prozor je preko cijelog prozora preglednika (kao na mobitelu); veličinu
    zadaje prozor preglednika.
  -->
  <div id="voiceflow-chat"></div>
  <script>
  (function () {
    var host = document.getElementById('voiceflow-chat');
    var root = host.attachShadow({ mode: 'open' });
    root.innerHTML =
      '<style>' +
      '.vfrc-chat{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;background:#fff;font-family:sans-serif}' +
      '.vfrc-start{position:absolute;left:0;right:0;bottom:24px;text-align:center}' +
      '</style>' +
      '<div class="vfrc-chat"><div class="vfrc-start"><button id="vfrc-start-chat">Start new chat</button></div></div>';
    window.voiceflow = { chat: { close: function () {}, open: function () {} } };

    var q = new URLSearchParams(location.search);
    var src = q.get('skripta') || 'saturn/pocetna-chata-saturn.js';
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () {
      // chat se "otvori" čim je modul učitan (kao kad kupac klikne na gumb chata)
      setTimeout(function () { window.postMessage('{"type":"voiceflow:open"}', '*'); }, 50);
    };
    document.head.appendChild(s);
  })();
  </script>
</body>
</html>
