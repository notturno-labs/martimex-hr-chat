<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tri note – pokus</title>
  <!--
    Pokusna animacija "Tri note" (vidi tri-note.js) na početnom ekranu chata:
    raspored i stil su prepisani iz pocetna-chata.js (CSS bez :host), pa
    izgleda kao pravi početni ekran. Ne treba Voiceflow ni martimex.hr.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; }

    @font-face{font-family:"MX Jost";src:url("../../fonts/jost-latin.woff2") format("woff2");font-weight:300 600;font-style:normal}
    @font-face{font-family:"MX Jost";src:url("../../fonts/jost-latin-ext.woff2") format("woff2");font-weight:300 600;font-style:normal;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
    @font-face{font-family:"MX Cormorant";src:url("../../fonts/cormorant-garamond-latin.woff2") format("woff2");font-weight:500 700;font-style:normal}

    .mx-p {
      --mx-p-podloga: #000000;
      --mx-p-puder: #f6ebe7;
      --mx-p-bjelokost: #f4ece6;
      --mx-p-rose: #e3c1ac;
      --mx-p-rose-0: rgba(227, 193, 172, 0);
      --mx-p-rose-90: rgba(227, 193, 172, 0.9);
      --mx-p-rose-25: rgba(227, 193, 172, 0.25);
      --mx-p-sjaj-poziva: #fff7f0;
      --mx-p-opis: #a89d95;
      --mx-p-zaglavlje: #cfc6bf;
      --mx-p-zlatni-sjaj: rgba(201, 164, 92, 0.1);
      --mx-p-zlatni-sjaj-0: rgba(201, 164, 92, 0);
      --mx-p-staklo: rgba(207, 198, 191, 0.08);
      --mx-p-glatko: cubic-bezier(.16, 1, .3, 1);
      --mx-p-meko: cubic-bezier(.45, 0, .2, 1);
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: 1000;
      container-type: size;           /* za @container: na niskom prozoru se raspored stisne */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: inherit;
      background: var(--mx-p-podloga);
      color: var(--mx-p-bjelokost);
      font-family: "MX Jost", "Futura", "Century Gothic", "Avenir Next", Avenir, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px;
      font-weight: 300;
      line-height: 1.4;
      letter-spacing: normal;
      text-align: left;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-user-select: none;
              user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .mx-p * { box-sizing: border-box; }

    .mx-p-platno {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      opacity: 0;
      transition: opacity .5s linear;
    }
    .mx-p-spremno .mx-p-platno { opacity: 1; }

    /* ── 1. zaglavlje ── */
    .mx-p-vrh {
      position: relative;
      z-index: 2;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(64px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 64px 0;
    }
    .mx-p-marka {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .42em;
      padding-left: .42em;            /* optički centrira razmaknuta slova */
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--mx-p-zaglavlje);
    }
    .mx-p-zatvori {
      -webkit-appearance: none;
              appearance: none;
      position: absolute;
      right: 14px;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--mx-p-zaglavlje);
      cursor: pointer;
      transition: background-color .3s var(--mx-p-meko);
    }
    .mx-p-zatvori:hover { background-color: var(--mx-p-staklo); }
    .mx-p-zatvori:focus { outline: none; }
    .mx-p-zatvori:focus-visible { outline: 1px solid var(--mx-p-rose); outline-offset: 2px; }
    .mx-p-zatvori svg { width: 16px; height: 16px; display: block; }

    /* ── 2. hero: okvir animacije (450 px), iza nje meki zlatni sjaj ── */
    .mx-p-scena {
      flex: 0 1 450px;
      min-height: 150px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: radial-gradient(closest-side, var(--mx-p-zlatni-sjaj), var(--mx-p-zlatni-sjaj-0) 100%);
    }
    /* prostor animacije: 345 × 393 px, poravnat na dno okvira */
    .mx-p-animacija {
      position: relative;
      flex: none;
      width: 345px;
      max-width: 100%;
      height: 393px;
      max-height: 100%;
    }
    .mx-p-naslov-sr {             /* natpis za čitače zaslona (na ekranu ga crtaju točkice) */
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .mx-p-podnaslov {
      position: absolute;
      left: -40px;
      right: -40px;
      top: var(--mx-p-ispod, 72%);
      margin: 0;
      text-align: center;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .3em;
      text-indent: .3em;
      text-transform: uppercase;
      color: var(--mx-p-puder);
      opacity: 0;
      transform: translateY(8px);
      filter: blur(3px);
      transition: opacity .9s var(--mx-p-meko), transform 1.3s var(--mx-p-glatko), filter 1s var(--mx-p-meko);
      pointer-events: none;
    }
    .mx-p-podnaslov-da .mx-p-podnaslov { opacity: .72; transform: none; filter: none; }

    /* bez WebGL-a: natpis slovima (razmaknuta velika slova); širina prati
       prozor (cqw), da natpis uvijek stane s razmakom do ruba */
    .mx-p-rezerva {
      display: none;
      position: absolute;
      left: -100px; right: -100px;
      top: 50%;
      margin: 0;
      transform: translateY(-50%);
      text-align: center;
      white-space: nowrap;
      font-family: "MX Cormorant", "Cormorant Garamond", Garamond, Georgia, "Times New Roman", serif;
      font-size: 44px;
      font-size: min(58px, calc((100cqw - 56px) / 6.34));
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.14em;
      padding-left: 0.14em;    /* optički centrira razmaknuta slova */
      color: var(--mx-p-puder);
    }
    .mx-p-bez-gl .mx-p-rezerva { display: block; animation: mx-p-rezerva 1.6s var(--mx-p-glatko) .2s backwards; }
    .mx-p-bez-gl .mx-p-podnaslov { top: calc(50% + 36px); opacity: .72; transform: none; filter: none; }

    /* ── 3. tekst: naslov → statična crta → opis (stoji cijelo vrijeme) ── */
    .mx-p-tekst {
      position: relative;
      z-index: 2;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      padding: 44px 40px 16px;
      text-align: center;
    }
    .mx-p-naslov {
      margin: 0;
      font-size: 29px;
      font-weight: 300;
      line-height: 1.14;
      letter-spacing: -.02em;
      color: var(--mx-p-bjelokost);
    }
    .mx-p-naslov-naglasak { color: var(--mx-p-rose); }

    /* ── 4. statična crta ispod naslova (bez animacije) ── */
    .mx-p-crta {
      display: block;
      flex: none;
      width: 300px;
      max-width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--mx-p-rose-0), var(--mx-p-rose-90), var(--mx-p-rose-0));
    }
    .mx-p-opis {
      margin: 0;
      max-width: 320px;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.6;
      color: var(--mx-p-opis);
    }

    /* ── 5. poziv "POČETAK" na dnu ── */
    .mx-p-dno {
      position: relative;
      z-index: 2;
      flex: none;
      display: flex;
      justify-content: center;
      padding: 0 0 calc(34px + env(safe-area-inset-bottom, 0px));
    }
    .mx-p-gumb {
      -webkit-appearance: none;
              appearance: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 0;
      padding: 10px 24px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--mx-p-rose);
      font: inherit;
      cursor: pointer;
    }
    .mx-p-gumb:focus { outline: none; }
    .mx-p-gumb:focus-visible { outline: 1px solid var(--mx-p-rose); outline-offset: 4px; }
    .mx-p-gumb-tekst {
      display: block;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: .42em;
      padding-left: .42em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--mx-p-rose);
    }
    /* svjetlosni odsjaj prelazi preko slova */
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      .mx-p-gumb-tekst {
        background: linear-gradient(90deg,
          var(--mx-p-rose) 0%,
          var(--mx-p-rose) 38%,
          var(--mx-p-sjaj-poziva) 50%,
          var(--mx-p-rose) 62%,
          var(--mx-p-rose) 100%);
        background-size: 200% 100%;
        -webkit-background-clip: text;
                background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: mx-p-sjaj-poziva 3.6s linear infinite;
      }
    }
    /* crta ispod poziva "diše" */
    .mx-p-gumb-crta {
      display: block;
      width: 160px;
      height: 1px;
      background: linear-gradient(90deg, var(--mx-p-rose-0), var(--mx-p-rose-90), var(--mx-p-rose-0));
      animation: mx-p-linija 2.6s ease-in-out infinite;
    }

    /* nizak prozor chata: animacija se smanji, a tekst se stisne */
    @container (max-height: 820px) {
      .mx-p-tekst { padding-top: 30px; }
    }
    @container (max-height: 720px) {
      .mx-p-tekst { gap: 14px; padding-top: 22px; }
      .mx-p-naslov { font-size: 26px; }
      .mx-p-opis { font-size: 13px; line-height: 1.5; }
      .mx-p-dno { padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
    }
    @container (max-height: 580px) {
      .mx-p-opis { display: none; }
    }
    /* uzak prozor (mobitel) */
    @container (max-width: 400px) {
      .mx-p-tekst { padding-left: 24px; padding-right: 24px; }
    }

    /* ── pojava pri svakom otvaranju ── */
    .mx-p-ulaz .mx-p-vrh { animation: mx-p-pojava .9s var(--mx-p-glatko) .1s backwards; }
    .mx-p-ulaz .mx-p-tekst { animation: mx-p-pojava 1.1s var(--mx-p-glatko) .35s backwards; }
    .mx-p-ulaz .mx-p-dno { animation: mx-p-pojava 1s var(--mx-p-glatko) .6s backwards; }

    /* ── nakon "Početak": tekst i poziv se povuku, chat se otvori u krugu ── */
    .mx-p-izlaz { pointer-events: none; }
    .mx-p-izlaz .mx-p-vrh,
    .mx-p-izlaz .mx-p-tekst,
    .mx-p-izlaz .mx-p-dno,
    .mx-p-izlaz .mx-p-podnaslov {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .35s var(--mx-p-meko), transform .5s var(--mx-p-meko);
    }
    .mx-p-izlaz .mx-p-scena { opacity: 0; transition: opacity .6s var(--mx-p-meko); }

    @keyframes mx-p-sjaj-poziva {
      0%   { background-position: 150% 0; }
      100% { background-position: -150% 0; }
    }
    @keyframes mx-p-linija {
      0%, 100% { transform: scaleX(.35); opacity: .45; }
      50%      { transform: scaleX(1);   opacity: 1; }
    }
    @keyframes mx-p-pojava {
      from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
    }
    @keyframes mx-p-rezerva {
      from { opacity: 0; transform: translateY(-42%); filter: blur(10px); letter-spacing: .3em; }
    }
    @keyframes mx-p-prozirnost {
      from { opacity: 0; }
    }

    /* "Smanji pokrete": ništa se ne pomiče, samo se tiho pojavi */
    @media (prefers-reduced-motion: reduce) {
      .mx-p-ulaz .mx-p-vrh,
      .mx-p-ulaz .mx-p-tekst,
      .mx-p-ulaz .mx-p-dno,
      .mx-p-bez-gl .mx-p-rezerva { animation: mx-p-prozirnost .4s linear backwards; }
      .mx-p-gumb-tekst {
        animation: none;
        background: none;
        -webkit-text-fill-color: currentColor;
        color: var(--mx-p-rose);
      }
      .mx-p-gumb-crta { animation: none; }
      .mx-p-podnaslov { transition: opacity .4s linear; transform: none; filter: none; }
    }
  
  </style>
</head>
<body>
  <div class="mx-p mx-p-ulaz" role="region" aria-label="MARTIMEX">
    <canvas class="mx-p-platno" aria-hidden="true"></canvas>
    <div class="mx-p-vrh">
      <span class="mx-p-marka">Martimex</span>
      <button class="mx-p-zatvori" type="button" aria-label="Zatvori chat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
    </div>
    <div class="mx-p-scena"><div class="mx-p-animacija"></div></div>
    <div class="mx-p-tekst">
      <h2 class="mx-p-naslov">Vaš osobni<br><span class="mx-p-naslov-naglasak">AI beauty savjetnik</span></h2>
      <span class="mx-p-crta" aria-hidden="true"></span>
      <p class="mx-p-opis">Trebate pomoć pri odabiru proizvoda, imate pitanje o&nbsp;narudžbi ili vas zanima nešto vezano uz Martimex? Sve odgovore možete dobiti ovdje.</p>
    </div>
    <div class="mx-p-dno">
      <button class="mx-p-gumb" type="button" aria-label="Početak razgovora"><span class="mx-p-gumb-tekst">Početak</span><span class="mx-p-gumb-crta" aria-hidden="true"></span></button>
    </div>
  </div>
  <script src="tri-note.js"></script>
</body>
</html>
