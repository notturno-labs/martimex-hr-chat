<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marti – testna stranica</title>
  <script>
    // Chat je isti kao na martimex.hr: loader.js (iz iste mape kao ova
    // stranica, pa radi i kad se grana gleda preko raw.githack.com) učita
    // module, među njima jedan-ekran.js — chat na jednom ekranu s trakama
    // brendova i Martinim pozdravom s ikonama — i gumb-chata.js (gumb chata).
    //   proba.html                     → kao na martimex.hr
    //   proba.html?popust=1            → uz to probni popusti na karticama artikla (vidi dolje)
    //   proba.html?izgled=dosadasnji   → dosadašnji početni ekran (pocetna-chata.js), za usporedbu
    (function () {
      if (new URLSearchParams(location.search).get('izgled') !== 'dosadasnji') return;
      window.__mxJedanEkran = true;   // jedan-ekran.js (iz loader.js) se ne pokreće
      window.__mxTemaChata = true;    // ni tema-chata.js, ako se uključi u loader.js
      // Voiceflow: razgovor kreće tek gumbom "Početak" (to postavi i pocetna-chata.js;
      // ovdje je da sigurno stigne prije nego loader.js preda postavke Voiceflowu)
      window.MartimexVoiceflow = { autostart: false, assistant: { persistence: 'sessionStorage' } };
      var s = document.createElement('script');
      s.src = new URL('pocetna-chata.js', location.href).href + '?v=' + Math.floor(Date.now() / 60000);
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <h1>Testna stranica za Marti chat</h1>
  <p>Ova stranica glumi martimex.hr. Chat je u kutu ekrana, isti kao na webshopu: razgovor kreće sam kad se chat otvori.</p>
  <p><a href="?">Chat kao na martimex.hr</a> · <a href="?popust=1">S probnim popustima na karticama</a> · <a href="?izgled=dosadasnji">Dosadašnji početni ekran (za usporedbu)</a></p>

  <!-- Marti chat (Martimex) – ovaj kod se ne mijenja, sve izmjene rade se na GitHubu -->
  <script>
  (function () {
    // Zaštita ako je kod slučajno zalijepljen dvaput
    if (window.__martimexChat) return;
    window.__martimexChat = true;

    var GITHUB_LOADER = new URL('loader.js', location.href).href;   // na martimex.hr: https://notturno-labs.github.io/martimex-hr-chat/loader.js
    var CEKAJ_GITHUB  = 5000;  // ms – nakon toga chat kreće bez dodataka s GitHuba

    // Osnovne Voiceflow postavke – s njima chat radi i kad GitHub ne radi
    var osnovno = {
      verify: { projectID: '6abcf8b2128a6fc786128cca' },
      url: 'https://general-runtime.voiceflow.com',
      voice: { url: 'https://runtime-api.voiceflow.com' }
    };

    var vfSpreman = false, githubGotov = false, domSpreman = false, pokrenut = false, dodatno = {};

    function ucitajChat(cfg) {
      return Promise.resolve().then(function () { return window.voiceflow.chat.load(cfg); });
    }

    // Chat kreće tek kad su spremni Voiceflow, stranica i GitHub (ili je GitHub otpisan)
    function pokreni() {
      if (pokrenut || !vfSpreman || !githubGotov || !domSpreman) return;
      pokrenut = true;
      ucitajChat(Object.assign({}, osnovno, dodatno))
        .catch(function (e) {
          console.error('[Martimex] Chat se nije pokrenuo s GitHub postavkama – pokrećem osnovni', e);
          return ucitajChat(osnovno);
        })
        .catch(function (e) { console.error('[Martimex] Chat se nije pokrenuo', e); });
    }

    function bezGithuba() {
      if (githubGotov) return;
      console.warn('[Martimex] GitHub nije odgovorio – chat kreće bez dodataka s GitHuba');
      githubGotov = true;
      pokreni();
    }

    // loader.js s GitHuba javlja se ovdje kad je spreman
    window.__martimexGitHub = function (cfg) {
      if (githubGotov) return;  // stiglo prekasno – chat već radi bez toga
      dodatno = cfg || {};
      githubGotov = true;
      pokreni();
    };

    // 1) Stranica
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { domSpreman = true; pokreni(); });
    } else {
      domSpreman = true;
    }

    // 2) Voiceflow widget – uvijek izravno s Voiceflowa
    var vf = document.createElement('script');
    vf.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
    vf.onload = function () { vfSpreman = true; pokreni(); };
    vf.onerror = function () { console.error('[Martimex] Voiceflow widget se nije učitao'); };
    document.head.appendChild(vf);

    // 3) Ekstenzije (i kasnije dizajn) s GitHuba – učitava se istovremeno s Voiceflowom
    var gh = document.createElement('script');
    gh.src = GITHUB_LOADER + '?v=' + Math.floor(Date.now() / 60000);
    gh.onerror = bezGithuba;
    document.head.appendChild(gh);
    setTimeout(bezGithuba, CEKAJ_GITHUB);
  })();
  </script>

  <!-- Samo na testnoj stranici: ?popust=1 → probni popusti na karticama artikla.
       Voiceflow funkcija još ne šalje akciju ni promo kod, pa se dodaju ovdje:
       1. kartica u preporuci → promo kod MRTMX −30 %, 2. → akcija (stara cijena
       25 % viša), 3. → akcija + kod. Kartice koje popust već imaju ostaju kakve jesu. -->
  <script>
  (function () {
    if (new URLSearchParams(location.search).get('popust') !== '1') return;
    var izvorni = window.__martimexGitHub;
    if (typeof izvorni !== 'function') return;

    function dodajPopuste(trace) {
      var p = trace && trace.payload;
      if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { return trace; } }
      var lista = p && (p.cards || p.kartice);
      if (!Array.isArray(lista)) return trace;
      var kartice = lista.map(function (c, i) {
        if (!c || c.oldPrice != null || c.promo || c.promoCode) return c;
        var n = parseFloat(String(c.price).replace(/[^\d.,]/g, '').replace(',', '.'));
        var k = Object.assign({}, c);
        var vrsta = i % 3;
        if (vrsta !== 1) k.promo = { code: 'MRTMX', percent: 30 };
        if (vrsta !== 0 && isFinite(n)) k.oldPrice = (Math.round(n * 125) / 100).toFixed(2);
        return k;
      });
      return Object.assign({}, trace, { payload: Object.assign({}, p, { cards: kartice }) });
    }

    // loader.js preda postavke ovoj funkciji; kartica artikla dobije probne popuste
    window.__martimexGitHub = function (cfg) {
      var a = cfg && cfg.assistant;
      if (a && Array.isArray(a.extensions)) {
        var ekstenzije = a.extensions.map(function (e) {
          if (!e || e.name !== 'ProductCard') return e;
          return Object.assign({}, e, {
            render: function (x) { return e.render(Object.assign({}, x, { trace: dodajPopuste(x.trace) })); }
          });
        });
        cfg = Object.assign({}, cfg, { assistant: Object.assign({}, a, { extensions: ekstenzije }) });
      }
      return izvorni(cfg);
    };
  })();
  </script>
</body>
</html>
