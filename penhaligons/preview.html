<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script src="shared.js"></script>
<script>
// Pregled Penhaligon's bočica u stilu animacije (iste boje i svjetlo kao
// pocetna-chata.js). Parametri u adresi:
//   ids=lady-blanche,mr-sam,...   bočice (svaka iz glave/<id>.js)
//   n=26000                       točkica po bočici
//   kut=0,-35,90,180              okret svake bočice (stupnjevi; + = okret ulijevo, kao u animaciji)
//   w=460&h=700&S=175             veličina platna i px po svjetskoj jedinici (u animaciji S ≈ 175)
//   razmak=0                      vodoravni razmak između bočica (px platna); 0 = jedna bočica po kutu
//   mod=tocke | silueta           silueta: pravokutni pogled sprijeda, 1 px platna = 1 px fotografije
const Q = new URLSearchParams(location.search);
const ids = (Q.get('ids') || 'proba').split(',');
const N = +(Q.get('n') || 26000);
const kutevi = (Q.get('kut') || '0').split(',').map(Number);
const W = +(Q.get('w') || 460), H = +(Q.get('h') || 700), Ssv = +(Q.get('S') || 175);
const RAZMAK = +(Q.get('razmak') || 0);
const MOD = Q.get('mod') || 'tocke';
const K = 1.76 / 684;                       // px fotografije → svjetska jedinica (kao flakon: visina 1,76)
const NAGIB = +(Q.get('nagib') || 0.08);
const BOJE = { srebro: '#e8e6eb', zlato: '#e0bb72', puder: '#f6ebe7' };
function rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
function zasiti(c, k) { const l = (c[0] + c[1] + c[2]) / 3; return c.map(v => Math.min(1, Math.max(0, l + (v - l) * k))); }

function ucitaj(src) { return new Promise((ok, ne) => { const s = document.createElement('script'); s.src = src + '?v=' + Date.now(); s.onload = ok; s.onerror = () => ne(new Error('nema ' + src)); document.head.appendChild(s); }); }

(async function () {
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    for (const id of ids) await ucitaj('glave/' + id + '.js');
    const c = document.getElementById('c');
    const dpr = 1;
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
    const gl = c.getContext('webgl', { antialias: true, premultipliedAlpha: false });
    const VS = `
      precision highp float;
      attribute vec3 aPos; attribute vec3 aNor; attribute float aVrsta; attribute float aRnd;
      uniform mat3 uRot; uniform vec2 uPx; uniform vec2 uCenter; uniform float uSize, uK, uY0, uAlpha; uniform highp float uSil;
      uniform vec3 uSilver, uGold, uPowder, uTop, uBottom;
      varying vec4 vCol;
      const float CAM = 4.2;
      void main() {
        vec3 p = vec3(aPos.x, aPos.y - uY0, aPos.z) * uK;
        vec3 q = uRot * p, nq = normalize(uRot * aNor);
        if (uSil > 0.5) {
          gl_Position = vec4(aPos.x * uPx.x + uCenter.x, (aPos.y - uY0) * uPx.y + uCenter.y, 0.0, 1.0);
          gl_PointSize = 2.0; vCol = vec4(1.0); return;
        }
        float persp = CAM / (CAM - q.z);
        gl_Position = vec4(q.x * uPx.x * persp + uCenter.x, q.y * uPx.y * persp + uCenter.y, 0.0, 1.0);
        float iskra = step(0.993, aRnd);
        gl_PointSize = uSize * persp * (1.0 + iskra * 0.7);
        vec3 c; float lit, back, jak = 1.0;
        if (aVrsta < 0.5) {                     // obojeno staklo s tekućinom (tamnije gore)
          vec3 t = mix(uBottom, uTop, smoothstep(64.0, 320.0, aPos.y));
          c = mix(uSilver, t, 0.82) * 1.12; lit = 0.75; back = 0.45;
        } else if (aVrsta < 1.5) {              // prozirno debelo dno
          c = uSilver; lit = 0.75; back = 0.45; jak = 0.8;
        } else if (aVrsta < 2.5) {              // zlato (ovratnik i glava)
          c = uGold * 1.05; lit = 1.0; back = 0.28;
        } else {                                // etiketa
          c = uPowder * 1.05; lit = 0.35; back = 0.45;
        }
        vec3 L = normalize(vec3(-0.5, 0.62, 0.6));
        vec3 Hh = normalize(L + vec3(0.0, 0.0, 1.0));
        float dif = max(dot(nq, L), 0.0);
        float spe = pow(max(dot(nq, Hh), 0.0), 26.0);
        float rub = pow(1.0 - abs(nq.z), 2.2);
        float nebo = smoothstep(-0.08, 0.3, nq.y);
        float svjetlo = 0.08 + 0.7 * dif + 1.5 * spe + 0.6 * rub + 0.28 * nebo;
        float lice = mix(back, 1.0, smoothstep(-0.2, 0.25, nq.z));
        float dubina = mix(1.0, clamp(0.62 + 0.42 * q.z, 0.25, 1.15), lit);
        vCol = vec4(c * mix(1.0, svjetlo, lit) * lice, uAlpha * jak * dubina);
      }`;
    const FS = `precision mediump float; varying vec4 vCol; uniform highp float uSil;
      void main() { vec2 d = gl_PointCoord * 2.0 - 1.0; float r = dot(d, d); if (r > 1.0) discard;
        gl_FragColor = uSil > 0.5 ? vec4(1.0) : vec4(vCol.rgb, vCol.a * (1.0 - 0.6 * r)); }`;
    function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
    const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    const U = n => gl.getUniformLocation(pr, n);
    gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND);
    if (MOD === 'silueta') gl.blendFunc(gl.ONE, gl.ZERO); else gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform3fv(U('uSilver'), rgb(BOJE.srebro)); gl.uniform3fv(U('uGold'), zasiti(rgb(BOJE.zlato), 1.2)); gl.uniform3fv(U('uPowder'), rgb(BOJE.puder));
    gl.uniform1f(U('uK'), K); gl.uniform1f(U('uSil'), MOD === 'silueta' ? 1 : 0);
    gl.uniform1f(U('uSize'), 1.35 * dpr * Math.min(1.25, Math.max(0.8, Math.sqrt(Ssv / 160))));
    gl.uniform1f(U('uAlpha'), +(Q.get('alpha') || 0.7));
    const info = [];
    // raspored: jedna bočica po kutu (razmak 0) ili sve bočice jedna do druge
    const crtanja = [];
    if (RAZMAK > 0) ids.forEach((id, i) => crtanja.push({ id, kut: kutevi[i % kutevi.length], x: (i - (ids.length - 1) / 2) * RAZMAK }));
    else kutevi.forEach((k, i) => crtanja.push({ id: ids[0], kut: k, x: (i - (kutevi.length - 1) / 2) * (W / kutevi.length) }));
    const cache = {};
    for (const cr of crtanja) {
      const t0 = performance.now();
      const b = cache[cr.id] || (cache[cr.id] = PEN.bocica(cr.id, N, {}));
      info.push({ id: cr.id, ms: Math.round(performance.now() - t0), korak: b.korak, linija: b.linija });
      const g = PEN.glave[cr.id];
      const st = g.staklo || ['#888888', '#cccccc'];
      gl.uniform3fv(U('uTop'), zasiti(rgb(st[0]), 1.15)); gl.uniform3fv(U('uBottom'), zasiti(rgb(st[1]), 1.15));
      const rnd = new Float32Array(N); let s = 12345; for (let i = 0; i < N; i++) { s = (s * 16807) % 2147483647; rnd[i] = s / 2147483647; }
      const vrsta = b.vrsta;
      function buf(arr, loc, k) { const bf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bf); gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW); const l = gl.getAttribLocation(pr, loc); if (l >= 0) { gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, k, gl.FLOAT, false, 0, 0); } }
      buf(b.poz, 'aPos', 3); buf(b.nor, 'aNor', 3); buf(vrsta, 'aVrsta', 1); buf(rnd, 'aRnd', 1);
      const a = cr.kut * Math.PI / 180, nb = MOD === 'silueta' ? 0 : NAGIB;
      const cy = Math.cos(a), sy = Math.sin(a), cx = Math.cos(nb), sx = Math.sin(nb);
      // Rx(nagib) · Ry(kut), po stupcima (kao matrica() u animaciji)
      const m = [[cy, 0, sy], [sx * sy, cx, -sx * cy], [-cx * sy, sx, cx * cy]];
      gl.uniformMatrix3fv(U('uRot'), false, [m[0][0], m[1][0], m[2][0], m[0][1], m[1][1], m[2][1], m[0][2], m[1][2], m[2][2]]);
      if (MOD === 'silueta') {
        // 1 px fotografije = 1 px platna; dno bočice na dnu platna
        gl.uniform2f(U('uPx'), 2 / W, 2 / H); gl.uniform1f(U('uY0'), 0);
        gl.uniform2f(U('uCenter'), 2 * (W / 2 + cr.x) / W - 1, -1);
      } else {
        gl.uniform2f(U('uPx'), 2 * Ssv / W, 2 * Ssv / H); gl.uniform1f(U('uY0'), +(Q.get('y0') || 342));
        gl.uniform2f(U('uCenter'), 2 * (W / 2 + cr.x) / W - 1, +(Q.get('cy') || 0));
      }
      gl.drawArrays(gl.POINTS, 0, N);
    }
    window.__info = info; window.__gotovo = true;
  } catch (e) { window.__greska = String(e && e.stack || e); window.__gotovo = true; }
})();
</script>
</body></html>
