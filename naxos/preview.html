<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}#okvir{position:relative}canvas,img{display:block;position:absolute;left:0;top:0}
/* pisma kao u animaciji (mapa fonts/): natpis NAXOS na flakonu */
@font-face{font-family:"MX Cormorant";src:url("../fonts/cormorant-garamond-latin.woff2") format("woff2");font-weight:500 700;font-style:normal}
</style></head>
<body>
<div id="okvir"><img id="foto" alt=""><canvas id="c"></canvas></div>
<script src="../pocetna-chata.js"></script>
<script src="naxos.js"></script>
<script>
// Pregled prizora Naxos u stilu animacije (iste boje, svjetlo, iskre i
// treptaj kao pocetna-chata.js; geometrija flakona iz pocetna-chata.js).
// Parametri u adresi:
//   n=200000        ukupno točkica u prizoru
//   kut=0           njihanje prizora oko okomite osi (stupnjevi; + = okret ulijevo)
//   nagib=          nagib pogleda (rad; zadano kao u animaciji, NAX.NAGIB)
//   w=460&h=700     veličina platna; S=175 px po jedinici prostora animacije
//   foto=0.5        ispod točkica prikaži fotografiju (prozirnost), za provjeru poklapanja
//   udio=0.75       udio boje s fotografije u boji predmeta (0 = samo opisane boje, 1 = samo fotografija)
//   t=7             vrijeme (s) za treptaj i mlaz
const Q = new URLSearchParams(location.search);
const N = +(Q.get('n') || 200000);
const KUT = (+(Q.get('kut') || 0)) * Math.PI / 180;
const W = +(Q.get('w') || 460), H = +(Q.get('h') || 700), Ssv = +(Q.get('S') || 175);
const FOTO = +(Q.get('foto') || 0);
const TT = +(Q.get('t') || 7);
const UDIO = Q.get('udio') === null ? 0.75 : +Q.get('udio');
const NAX = window.MX_NAXOS, FL = window.MX_POCETNA_FLAKON;
const NAGIB = Q.get('nagib') ? +Q.get('nagib') : NAX.NAGIB;

function ucitajFont() { return document.fonts && document.fonts.load ? document.fonts.load('600 100px "MX Cormorant"', 'NAXOS').catch(function () {}) : Promise.resolve(); }

(async function () {
  try {
    await ucitajFont();
    await NAX.pripremi();
    const okvir = document.getElementById('okvir');
    okvir.style.width = W + 'px'; okvir.style.height = H + 'px';
    const c = document.getElementById('c');
    const dpr = 1;
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
    // fotografija ispod: 1024 px ↔ 1024 · KAM_K jedinica; px 512 u sredini, py 760 ispod sredine za 0,396
    const foto = document.getElementById('foto');
    if (FOTO > 0) {
      const k = 0.002153 * Ssv;                               // px platna po pikselu fotografije
      foto.src = 'izvor.jpg';
      foto.style.width = (1024 * k) + 'px'; foto.style.height = (1024 * k) + 'px';
      foto.style.left = (W / 2 - 512 * k) + 'px';
      foto.style.top = (H / 2 + 0.396 * Ssv - 760 * k) + 'px';
      foto.style.opacity = String(FOTO);
    } else foto.style.display = 'none';

    const t0 = performance.now();
    const gen = NAX.gradiKoraci({ n: N, flakon: FL.gradi, sirinaFlakona: FL.sirina, vrhCepa: FL.vrhCepa, OMJER: FL.OMJER, foto: UDIO });
    let r = gen.next();
    while (!r.done) r = gen.next();
    const R = r.value;
    console.log('točkica', R.n, 'razmak', R.korak.toFixed(4), ((performance.now() - t0) / 1000).toFixed(1) + ' s');

    const gl = c.getContext('webgl', { antialias: false, premultipliedAlpha: false });
    const VS = `
      precision highp float;
      attribute vec4 aNax; attribute vec4 aNaxB; attribute vec4 aRnd;
      uniform mat3 uRot; uniform vec2 uPx; uniform vec2 uCenter; uniform float uSize, uAlpha, uTime, uCam;
      uniform vec4 uNaxA;   // KOMP, POMAK, mlaz vrh, mlaz duljina
      varying vec4 vCol;
      vec3 oktaedar(vec2 e) {
        vec3 v = vec3(e, 1.0 - abs(e.x) - abs(e.y));
        if (v.z < 0.0) v.xy = (1.0 - abs(v.yx)) * vec2(v.x >= 0.0 ? 1.0 : -1.0, v.y >= 0.0 ? 1.0 : -1.0);
        return normalize(v);
      }
      void main() {
        float w = aNax.w + 0.5;
        float qx = floor(w / 65536.0); float ost = w - qx * 65536.0;
        float qy = floor(ost / 256.0); float kg = ost - qy * 256.0;
        float vrsta = floor(kg / 16.0); float skupina = kg - vrsta * 16.0;
        vec3 n = oktaedar(vec2(qx, qy) / 127.5 - 1.0);
        float w2 = aNaxB.w + 0.5;
        float l1 = floor(w2 / 65536.0); float o2 = w2 - l1 * 65536.0;
        float b1 = floor(o2 / 256.0); float j1 = o2 - b1 * 256.0;
        float lit = l1 / 255.0, back = b1 / 255.0, jak = j1 / 255.0 * 4.0;
        vec3 col = aNaxB.xyz;
        float t = uTime;
        vec3 p = aNax.xyz;
        bool pozadina = abs(vrsta - 4.0) < 0.5, mlaz = abs(vrsta - 9.0) < 0.5, tkanina = abs(vrsta - 3.0) < 0.5;
        if (mlaz) { float h = fract((uNaxA.z - p.y) / uNaxA.w + t * 0.45); p.y = uNaxA.z - h * uNaxA.w; }
        p = p * uNaxA.x + vec3(0.0, uNaxA.y, 0.0);
        mat3 R = uRot;
        if (pozadina) { mat3 Rt = mat3(R[0][0], R[1][0], R[2][0], R[0][1], R[1][1], R[2][1], R[0][2], R[1][2], R[2][2]); p = Rt * p; n = Rt * n; }
        vec3 q = R * p; vec3 nq = normalize(R * n);
        float persp = uCam / (uCam - q.z);
        gl_Position = vec4(q.x * uPx.x * persp + uCenter.x, q.y * uPx.y * persp + uCenter.y, 0.0, 1.0);
        float iskra = step(0.993, aRnd.z) * ((tkanina || pozadina) ? 0.0 : 1.0);
        gl_PointSize = uSize * persp * (1.0 + iskra * 0.7) * (pozadina ? 1.0 + 0.12 * skupina : 1.0);
        vec3 L = normalize(vec3(-0.5, 0.62, 0.6));
        vec3 Hh = normalize(L + vec3(0.0, 0.0, 1.0));
        float dif = max(dot(nq, L), 0.0);
        float spe = pow(max(dot(nq, Hh), 0.0), 26.0);
        float rub = pow(1.0 - abs(nq.z), 2.2);
        float nebo = smoothstep(-0.08, 0.3, nq.y);
        float svjetlo = 0.08 + 0.7 * dif + 1.5 * spe + 0.6 * rub + 0.28 * nebo;
        float lice = mix(back, 1.0, smoothstep(-0.2, 0.25, nq.z));
        float dubina = mix(1.0, clamp(0.78 + 0.25 * q.z, 0.45, 1.1), lit);
        float treptaj = 0.84 + 0.16 * sin(t * (1.5 + 2.0 * aRnd.w) + aRnd.y * 40.0);
        treptaj = mix(treptaj, 1.0 + 1.1 * max(0.0, sin(t * 2.1 + aRnd.x * 50.0)), iskra);
        vCol = vec4(col * mix(1.0, svjetlo, lit) * lice, uAlpha * jak * treptaj * dubina);
      }`;
    const FS = `precision mediump float; varying vec4 vCol; void main() { vec2 d = gl_PointCoord * 2.0 - 1.0; float r = dot(d, d); if (r > 1.0) discard; gl_FragColor = vec4(vCol.rgb, vCol.a * (1.0 - 0.6 * r)); }`;
    function sh(tip, src) { const s = gl.createShader(tip); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.bindAttribLocation(prog, 0, 'aRnd'); gl.bindAttribLocation(prog, 1, 'aNax'); gl.bindAttribLocation(prog, 2, 'aNaxB');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    // spremnik: [aNax(4), aNaxB(4), aRnd(4)]
    const n = R.n, d = new Float32Array(n * 12);
    let a = 1234567;
    function rnd() { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < 8; k++) d[12 * i + k] = R.podaci[8 * i + k];
      d[12 * i + 8] = rnd(); d[12 * i + 9] = rnd(); d[12 * i + 10] = rnd(); d[12 * i + 11] = rnd();
    }
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, d, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 48, 32);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 48, 0);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 48, 16);
    gl.viewport(0, 0, c.width, c.height);
    gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.clearColor(0, 0, 0, FOTO > 0 ? 0 : 1); gl.clear(gl.COLOR_BUFFER_BIT);
    const U = function (ime) { return gl.getUniformLocation(prog, ime); };
    // okret: Rx(nagib) · Ry(kut), po stupcima
    const cy = Math.cos(KUT), sy = Math.sin(KUT), cx = Math.cos(NAGIB), sx = Math.sin(NAGIB);
    const m = [[cy, 0, sy], [sx * sy, cx, -sx * cy], [-cx * sy, sx, cx * cy]];
    gl.uniformMatrix3fv(U('uRot'), false, [m[0][0], m[1][0], m[2][0], m[0][1], m[1][1], m[2][1], m[0][2], m[1][2], m[2][2]]);
    gl.uniform2f(U('uPx'), 2 * Ssv / W, 2 * Ssv / H);
    gl.uniform2f(U('uCenter'), 0, 0);
    gl.uniform1f(U('uSize'), 1.35 * dpr * Math.min(1.25, Math.max(0.8, Math.sqrt(Ssv / 160))));
    gl.uniform1f(U('uTime'), TT);
    gl.uniform1f(U('uCam'), NAX.CAM);
    gl.uniform4f(U('uNaxA'), NAX.KOMP, NAX.POMAK, R.mlaz.vrh, R.mlaz.duljina);
    // jačina kao u animaciji: 0,7 uz razmak niti 0,01728 na zaslonu (26 000 točkica flakona), gustoća^-0,65
    const gustoca = Math.pow(0.01728 / (R.korak * NAX.KOMP * Ssv / 175), 2);
    const jacina = 0.7 * Math.min(2, Math.max(0.25, Math.pow(gustoca, -0.65)));
    gl.uniform1f(U('uAlpha'), +(Q.get('alpha') || jacina));
    gl.drawArrays(gl.POINTS, 0, n);
    window.__info = { n: R.n, korak: R.korak, jacina: jacina };
    window.__gotovo = true;
  } catch (e) { console.error(e); document.title = 'GREŠKA: ' + e.message; window.__greska = String(e && e.stack || e); window.__gotovo = true; }
})();
</script>
</body></html>
