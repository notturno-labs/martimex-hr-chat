<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marti – proba izgleda „Staklo”</title>
  <style>
    body { margin: 0; padding: 32px 24px; font-family: Georgia, "Times New Roman", serif; color: #1b1b1d; background: #fff; }
    h1 { margin: 0 0 8px; font-weight: 400; }
    p { max-width: 560px; line-height: 1.5; }
    .izbor { display: inline-flex; gap: 6px; margin-top: 8px; padding: 4px; border-radius: 999px; background: #f3eeeb; font-family: Arial, sans-serif; font-size: 14px; }
    .izbor a { padding: 7px 14px; border-radius: 999px; color: #1b1b1d; text-decoration: none; }
    .izbor a[aria-current] { background: #1b1b1d; color: #fff; }
  </style>
</head>
<body>
  <!--
    Proba novog izgleda chata (tema-chata.js) prije nego se uključi na martimex.hr.
    Stranica glumi martimex.hr: chat je isti kao na webshopu (isti kod, loader.js
    i moduli iz ove mape), samo se uz njih učita i tema-chata.js.
      proba-staklo.html          → novi izgled „Staklo”
      proba-staklo.html?tema=0   → dosadašnji izgled, za usporedbu
  -->
  <h1>Proba izgleda chata „Staklo”</h1>
  <p>Ova stranica glumi martimex.hr. Chat je u kutu ekrana; otvori ga, pritisni „Početak” i razgovaraj s Marti kao na webshopu.</p>
  <nav class="izbor" aria-label="Izgled chata">
    <a href="?tema=1" id="nova">Novi izgled</a>
    <a href="?tema=0" id="stara">Dosadašnji izgled</a>
  </nav>

  <script>
  (function () {
    var tema = new URLSearchParams(location.search).get('tema') !== '0';
    document.getElementById(tema ? 'nova' : 'stara').setAttribute('aria-current', 'page');
    // novi izgled: tema-chata.js iz iste mape kao ova stranica
    if (tema) {
      var t = document.createElement('script');
      t.src = 'tema-chata.js?v=' + Math.floor(Date.now() / 60000);
      document.head.appendChild(t);
    } else {
      window.__mxTemaChata = true;  // dosadašnji izgled i kad je tema uključena u loader.js
    }
  })();
  </script>

  <!-- Marti chat (Martimex) – isti kod kao na martimex.hr, samo se loader.js učitava iz iste mape kao ova stranica -->
  <script>
  (function () {
    // Zaštita ako je kod slučajno zalijepljen dvaput
    if (window.__martimexChat) return;
    window.__martimexChat = true;

    var GITHUB_LOADER = new URL('loader.js', location.href).href;
    var CEKAJ_GITHUB  = 5000;  // ms – nakon toga chat kreće bez dodataka s GitHuba

    // Osnovne Voiceflow postavke – s njima chat radi i kad GitHub ne radi
    var osnovno = {
      verify: { projectID: '6abcf8b2128a6fc786128cca' },
      url: 'https://general-runtime.voiceflow.com',
      voice: { url: 'https://runtime-api.voiceflow.com' }
    };

    var vfSpreman = false, githubGotov = false, domSpreman = false, pokrenut = false, dodatno = {};

    function ucitajChat(cfg) {
      return Promise.resolve().then(function () { return window.voiceflow.chat.load(cfg); });
    }

    // Chat kreće tek kad su spremni Voiceflow, stranica i GitHub (ili je GitHub otpisan)
    function pokreni() {
      if (pokrenut || !vfSpreman || !githubGotov || !domSpreman) return;
      pokrenut = true;
      ucitajChat(Object.assign({}, osnovno, dodatno))
        .catch(function (e) {
          console.error('[Martimex] Chat se nije pokrenuo s GitHub postavkama – pokrećem osnovni', e);
          return ucitajChat(osnovno);
        })
        .catch(function (e) { console.error('[Martimex] Chat se nije pokrenuo', e); });
    }

    function bezGithuba() {
      if (githubGotov) return;
      console.warn('[Martimex] GitHub nije odgovorio – chat kreće bez dodataka s GitHuba');
      githubGotov = true;
      pokreni();
    }

    // loader.js s GitHuba javlja se ovdje kad je spreman
    window.__martimexGitHub = function (cfg) {
      if (githubGotov) return;  // stiglo prekasno – chat već radi bez toga
      dodatno = cfg || {};
      githubGotov = true;
      pokreni();
    };

    // 1) Stranica
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { domSpreman = true; pokreni(); });
    } else {
      domSpreman = true;
    }

    // 2) Voiceflow widget – uvijek izravno s Voiceflowa
    var vf = document.createElement('script');
    vf.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
    vf.onload = function () { vfSpreman = true; pokreni(); };
    vf.onerror = function () { console.error('[Martimex] Voiceflow widget se nije učitao'); };
    document.head.appendChild(vf);

    // 3) Ekstenzije s GitHuba – učitava se istovremeno s Voiceflowom
    var gh = document.createElement('script');
    gh.src = GITHUB_LOADER + '?v=' + Math.floor(Date.now() / 60000);
    gh.onerror = bezGithuba;
    document.head.appendChild(gh);
    setTimeout(bezGithuba, CEKAJ_GITHUB);
  })();
  </script>
</body>
</html>
